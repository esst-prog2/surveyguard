  <script>
    // static spreadsheet: 60 rows x 10 answer columns, seeded so every render matches
    (function () {
      const sheet = document.getElementById("ro-sheet");
      let s = 8020;
      const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
      let html = '<div class="r h"><span>idno</span>' + ["q1","q2","q3","q4","q5","q6","q7","q8","q9","q10"].map((q) => "<span>" + q + "</span>").join("") + "</div>";
      for (let i = 0; i < 60; i++) {
        const flat = i % 17 === 9;
        const v = 1 + Math.floor(rnd() * 5);
        let cells = "";
        for (let k = 0; k < 10; k++) cells += "<span>" + (flat ? v : 1 + Math.floor(rnd() * 5)) + "</span>";
        html += '<div class="r"><span>' + (5000 + i * 3) + "</span>" + cells + "</div>";
      }
      sheet.innerHTML = html;
    })();
    const tl = gsap.timeline({ paused: true });
    // the sheet scrolls while she reads
    tl.fromTo("#ro-sheet", { y: 0 }, { y: -1100, duration: 4.4, ease: "none" }, 0);
    // breath (acting, not a loop on text)
    tl.fromTo("#ro-body", { y: 0 }, { y: -4, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
    // captions on the wall
    tl.fromTo("#ro-c1", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.15);
    tl.to("#ro-c1", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 2.55);
    tl.fromTo("#ro-c2", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 2.8);
    tl.to("#ro-c2", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 5.02);
    // she leans in, then the hand goes to her head (anticipation, move, settle; head leads, arm follows)

    tl.to("#ro-larm", { opacity: 0, duration: 0.08, ease: "none" }, 2.95);
    tl.fromTo("#ro-larm-head", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.6)" }, 2.95);

    tl.fromTo("#ro-app", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 4.4);
    // zoom through the laptop screen until it fills the frame (screen 820 px -> 1920 px)
