<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #26324A; }
      #root { position: relative; width: 100%; height: 100%; }
      #ground { position: absolute; inset: 0; background: #26324A; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="roomopen" data-composition-id="roomopen" data-composition-src="compositions/roomopen.html" data-start="0" data-duration="6.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="apprun" data-composition-id="apprun" data-composition-src="compositions/apprun.html" data-start="6.4" data-duration="6.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="appwhy" data-composition-id="appwhy" data-composition-src="compositions/appwhy.html" data-start="13" data-duration="7.9" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="appdone" data-composition-id="appdone" data-composition-src="compositions/appdone.html" data-start="20.9" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="roomclose" data-composition-id="roomclose" data-composition-src="compositions/roomclose.html" data-start="24.1" data-duration="2.85" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="26.95" data-duration="3.05" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
