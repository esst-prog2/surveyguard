<template>
  <style>
    @font-face { font-family: "Source Serif 4"; src: url("assets/fonts/SourceSerif4-600.woff2") format("woff2"); font-weight: 600; }
    @font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/IBMPlexSans-400.woff2") format("woff2"); font-weight: 400 600; }
    #root { position: absolute; inset: 0; background: #F7F5F0; color: #1B1F24; overflow: hidden; }
    #crowd-field-wrap { position: absolute; left: 820px; top: 120px; width: 960px; height: 845px; transform-origin: 30% 30%; }
    #crowd-field { display: block; width: 960px; height: 845px; }
    #crowd-copy { position: absolute; left: 150px; top: 360px; width: 600px; }
    #crowd-l1 { font: 600 110px/1 "Source Serif 4", serif; letter-spacing: -0.01em; }
    #crowd-l1 small { display: block; font: 400 40px/1.3 "IBM Plex Sans", sans-serif; color: #5B6470; margin-top: 10px; letter-spacing: 0; }
    #crowd-l2 { font: 600 64px/1.08 "Source Serif 4", serif; margin-top: 44px; }
  </style>
  <div id="root" data-composition-id="crowd" data-width="1920" data-height="1080">
    <div id="crowd-field-wrap" data-layout-allow-overflow><canvas id="crowd-field" width="2160" height="1900"></canvas></div>
    <div id="crowd-copy">
      <h2 id="crowd-l1">1,498<small>respondents in one real survey wave</small></h2>
      <p id="crowd-l2">Which ones didn't read?</p>
    </div>
  </div>
  <script>
    // Static field of 1,498 answer strips (24 columns x 63 rows, last row partial), drawn once with a seeded RNG.
    (function () {
      const c = document.getElementById("crowd-field");
      const g = c.getContext("2d");
      const blues = ["#DCE6F0", "#B5CAE0", "#8AABCD", "#5E86B2", "#2F5D8A"];
      let s = 20261114;
      const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
      const flagged = new Set([37, 190, 311, 466, 602, 781, 905, 1033, 1260, 1411]); // 10 suspicious
      const cols = 24, cw = 6, cellW = 11, gap = 2, stripW = cw * cellW + (cw - 1) * gap, colGap = 14, rowH = 30;
      for (let n = 0; n < 1498; n++) {
        const col = n % cols, row = Math.floor(n / cols);
        const x = 4 + col * (stripW + colGap), y = 4 + row * rowH;
        const flat = flagged.has(n) && n % 2 === 1;
        for (let k = 0; k < cw; k++) {
          g.fillStyle = blues[flat ? 2 : Math.floor(rnd() * 5)];
          g.fillRect(x + k * (cellW + gap), y, cellW, 20);
        }
        if (flagged.has(n)) { g.strokeStyle = "#C0392B"; g.lineWidth = 4; g.strokeRect(x - 4, y - 4, stripW + 8, 28); }
      }
    })();
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#crowd-field-wrap", { scale: 3.2, opacity: 0.0 }, { scale: 1, opacity: 1, duration: 1.3, ease: "power2.inOut" }, 0);
    tl.fromTo("#crowd-l1", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 0.55);
    tl.fromTo("#crowd-l2", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 1.45);
    tl.to("#crowd-copy", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 2.75);
    window.__timelines["crowd"] = tl;
  </script>
